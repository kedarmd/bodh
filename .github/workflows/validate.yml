name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Validate core
        run: ./scripts/validate core

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config cmake clang \
            libfontconfig1-dev libfreetype6-dev libssl-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libxcb1-dev libvulkan-dev
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Validate desktop build and tests
        run: ./scripts/validate desktop
